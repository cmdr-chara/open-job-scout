[package]
name = "openjobscout"
version = "0.2.0-alpha.1"
edition = "2024"
description = "Fast, local-first job discovery and application tracking"
license = "MIT"
repository = "https://github.com/cmdr-chara/open-job-scout"

[[bin]]
name = "jobscout"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
csv = "1.3"
percent-encoding = "2"
ratatui = { version = "0.30.2", features = ["crossterm"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
toml = "0.9"
url = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
