[search]
# Each term is searched separately, so start with a short focused list.
terms = [
  "junior backend developer",
  "graduate software engineer",
]
# Source names are passed to JobSpy. Indeed is temporarily disabled for safety.
sites = ["linkedin"]
location = "Italy"
# JobSpy's country hint is used by some source adapters.
country_indeed = "Italy"
results_per_term = 20
max_age_days = 14

[profile]
# When false, degree_policy controls listings with an explicit degree requirement.
has_degree = true
# One of: "ignore", "penalize", "filter". Ignore makes no degree assumption.
degree_policy = "ignore"
degree_penalty = 15

[filters]
# Unknown remote status does not pass when this is true.
require_remote = false
allowed_employment_types = ["fulltime", "internship", "contract", ""]
blocked_title_terms = [
  "senior",
  "staff",
  "principal",
  "director",
  "head of",
]
blocked_description_terms = []
max_required_years = 3

[ranking]
# These transparent signals only order your local review queue.
preferred_title_terms = ["software engineer", "backend", "python"]
preferred_skills = ["python", "django", "fastapi", "postgresql", "docker"]
junior_signals = ["junior", "graduate", "entry level", "new grad", "internship"]
concern_signals = ["on-site only", "unpaid", "mandatory relocation"]

[salary]
# Only employer-published annual compensation is used; no salary is estimated.
minimum_annual = 0
preferred_annual = 50000
unknown_policy = "allow"
unknown_penalty = 0
preferred_bonus = 10

[storage]
# Tilde paths resolve beneath the current user's home directory.
database = "~/.openjobscout/jobs.sqlite3"
report_directory = "~/.openjobscout/reports"
stale_after_days = 30

# First-party ATS identifiers used by the native Rust search. These remain the
# fastest path for supported corporate boards and do not require Firecrawl.
[providers]
greenhouse = []
lever = []
lever_eu = []
ashby = []
recruitee = []

# Optional Firecrawl discovery for public employer career sites and difficult JS pages.
# Export FIRECRAWL_API_KEY before enabling it. The key is never written to this config.
[firecrawl]
enabled = false
search_enabled = true
search_limit_per_term = 8
max_scrapes = 16
# Examples:
# career_urls = ["https://example.com/careers"]
career_urls = []
# Interaction is exact-URL opt-in and only normal public navigation/load-more is allowed.
interact_urls = []
# Firecrawl accepts either include_domains or exclude_domains, not both. A non-empty
# include_domains allow-list takes precedence over the default exclusions below.
include_domains = []
exclude_domains = [
  "linkedin.com",
  "indeed.com",
  "glassdoor.com",
  "ziprecruiter.com",
  "greenhouse.io",
  "lever.co",
  "ashbyhq.com",
  "recruitee.com",
]
timeout_seconds = 45
zero_data_retention = true
