[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "openjobscout"
version = "0.1.0"
description = "Find, verify, rank, and track jobs locally."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "OpenJobScout contributors" }]
keywords = ["jobs", "job-search", "career", "cli", "sqlite", "privacy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
]
# Temporary repository pin: PyPI's JobSpy 1.1.82 requires a vulnerable
# markdownify release. Replace this with a normal release constraint once
# upstream publishes the corrected dependency metadata.
dependencies = [
  "python-jobspy @ git+https://github.com/speedyapply/JobSpy.git@fda080a373e8226f3fd60635323f5da9af9892b1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
jobscout = "open_job_scout.cli:main"

[project.urls]
Homepage = "https://github.com/cmdr-chara/open-job-scout"
Repository = "https://github.com/cmdr-chara/open-job-scout"
Documentation = "https://github.com/cmdr-chara/open-job-scout#readme"
Issues = "https://github.com/cmdr-chara/open-job-scout/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/open_job_scout"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
