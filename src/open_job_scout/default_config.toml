[search]
# Keep the first run small; add terms only after checking result quality.
terms = ["junior software engineer"]
# Source names are passed to JobSpy. Indeed is temporarily disabled for safety.
sites = ["linkedin"]
location = "Italy"
# JobSpy's country hint is used by some source adapters.
country_indeed = "Italy"
results_per_term = 20
max_age_days = 14

[profile]
# When false, degree_policy controls listings with an explicit degree requirement.
has_degree = true
# One of: "ignore", "penalize", "filter". Ignore makes no degree assumption.
degree_policy = "ignore"
degree_penalty = 15

[filters]
# Unknown remote status does not pass when this is true.
require_remote = false
allowed_employment_types = ["fulltime", "internship", "contract", ""]
blocked_title_terms = ["senior", "staff", "principal", "director", "head of"]
blocked_description_terms = []
max_required_years = 3

[ranking]
# These transparent signals only order your local review queue.
preferred_title_terms = ["software engineer", "backend", "python"]
preferred_skills = ["python", "django", "fastapi", "postgresql", "docker"]
junior_signals = ["junior", "graduate", "entry level", "new grad", "internship"]
concern_signals = ["on-site only", "unpaid", "mandatory relocation"]

[salary]
# Salary is never estimated. These settings only use compensation published by the employer.
minimum_annual = 0
preferred_annual = 50000
# One of: "allow", "filter". Keep "allow" unless salary disclosure is mandatory.
unknown_policy = "allow"
unknown_penalty = 0
preferred_bonus = 10

[storage]
# Tilde paths resolve beneath the current user's home directory.
database = "~/.openjobscout/jobs.sqlite3"
report_directory = "~/.openjobscout/reports"
# Unreviewed jobs not seen for this many days become stale, never silently deleted.
stale_after_days = 30

# Optional first-party public career boards used by the Rust native search.
# Values are board/company identifiers, not full URLs.
[providers]
greenhouse = []
lever = []
lever_eu = []
ashby = []
recruitee = []

# Optional hosted fallback for public corporate careers sites. Disabled by default.
# When enabled, FIRECRAWL_API_KEY must be present in the environment.
[firecrawl]
enabled = false
# Search the web from [search].terms and [search].location.
search_enabled = true
search_limit_per_term = 8
# Total pages scraped in one search run, including links found on careers pages.
max_scrapes = 16
# Seed public careers/job URLs directly instead of, or in addition to, web search.
career_urls = []
# Exact URL opt-in for normal public click/load-more navigation via /interact.
# Authentication, CAPTCHA bypass, application forms, and personal-data entry are prohibited.
interact_urls = []
# Optional domain allow-list. Leave empty to use exclude_domains instead.
include_domains = []
# Keep existing JobSpy/direct ATS paths as the default for these sources.
exclude_domains = [
  "linkedin.com",
  "indeed.com",
  "glassdoor.com",
  "ziprecruiter.com",
  "greenhouse.io",
  "lever.co",
  "ashbyhq.com",
  "recruitee.com",
]
timeout_seconds = 45
# Ask Firecrawl not to retain scrape data when supported by the selected plan/endpoint.
zero_data_retention = true
