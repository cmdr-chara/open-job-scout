name: Background import fix once

on:
  push:
    branches:
      - rewrite/rust-v2

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/rust-v2
      - name: Normalize imports and self-remove
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main.rs')
          text = path.read_text()
          text = text.replace('path::PathBuf,', 'path::{Path, PathBuf},')
          text = text.replace('path::PathBuf,\n', 'path::{Path, PathBuf},\n')
          path.write_text(text)
          PY
          cargo fmt --all
          rm .github/workflows/background-import-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs .github/workflows/background-import-fix-once.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Normalize background TUI imports"
          git push origin HEAD:rewrite/rust-v2
