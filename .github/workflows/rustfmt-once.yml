name: Rustfmt once

on:
  push:
    branches:
      - rewrite/rust-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/rust-v2
      - name: Format and self-remove
        run: |
          cargo fmt --all
          rm .github/workflows/rustfmt-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src Cargo.toml .github/workflows/rustfmt-once.yml
          git commit -m "Apply rustfmt to local workflow milestone"
          git push origin HEAD:rewrite/rust-v2
