name: Rustfmt once

on:
  push:
    branches:
      - rewrite/rust-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/rust-v2
      - name: Apply rustfmt and remove formatter workflow
        run: |
          cargo fmt --all
          rm .github/workflows/rustfmt-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/rustfmt-once.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply rustfmt to operational commands"
          git push origin HEAD:rewrite/rust-v2
