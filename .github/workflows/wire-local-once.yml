name: Wire local commands once

on:
  push:
    branches:
      - rewrite/rust-v2

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/rust-v2
      - name: Wire modules and commands
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main.rs')
          text = path.read_text()
          text = text.replace(
              'mod exporting;\nmod model;',
              'mod exporting;\nmod identity;\nmod importing;\nmod model;',
          )
          text = text.replace(
              'mod ranking;\nmod storage;',
              'mod ranking;\nmod reporting;\nmod storage;',
          )
          text = text.replace(
              'mod verification;\n',
              'mod verification;\nmod workflows;\n',
          )
          marker = '''    /// Recompute transparent ranking/filter diagnostics without network access.\n    Rerank,'''
          commands = '''    /// Import a JobSpy-compatible CSV through filtering, verification, ranking, and tracking.\n    ImportCsv {\n        path: PathBuf,\n        #[arg(long)]\n        no_verify: bool,\n        #[arg(long, default_value_t = 6)]\n        workers: usize,\n    },\n    /// Write a Markdown report from the current tracker.\n    Report {\n        #[arg(long)]\n        output: Option<PathBuf>,\n        #[arg(long, default_value_t = 50)]\n        limit: usize,\n    },\n    /// Recompute transparent ranking/filter diagnostics without network access.\n    Rerank,'''
          if 'ImportCsv {' not in text:
              text = text.replace(marker, commands)
          marker = '        Commands::History { id, limit } => command_history(&storage, &id, limit),\n'
          dispatch = '''        Commands::History { id, limit } => command_history(&storage, &id, limit),\n        Commands::ImportCsv {\n            path,\n            no_verify,\n            workers,\n        } => workflows::import_csv(&storage, &config_path, &path, !no_verify, workers).map(|_| ()),\n        Commands::Report { output, limit } => {\n            let report = workflows::report(&storage, output.as_deref(), limit)?;\n            println!("Report: {}", report.display());\n            Ok(())\n        }\n'''
          if 'workflows::import_csv' not in text:
              text = text.replace(marker, dispatch)
          path.write_text(text)
          PY
          cargo fmt --all
          rm .github/workflows/wire-local-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs .github/workflows/wire-local-once.yml
          git commit -m "Wire Rust import and report commands"
          git push origin HEAD:rewrite/rust-v2
