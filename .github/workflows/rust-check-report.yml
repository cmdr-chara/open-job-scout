name: Rust compact check report

on:
  push:
    branches:
      - rewrite/rust-v2

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run compact checks
        shell: bash
        run: |
          set +e
          : > rust-check-report.txt
          run_check() {
            name="$1"; shift
            echo "===== $name =====" >> rust-check-report.txt
            "$@" > /tmp/check.out 2>&1
            code=$?
            echo "exit=$code" >> rust-check-report.txt
            if [ $code -ne 0 ]; then
              tail -n 160 /tmp/check.out >> rust-check-report.txt
              echo >> rust-check-report.txt
              return $code
            fi
            echo "ok" >> rust-check-report.txt
            echo >> rust-check-report.txt
            return 0
          }
          run_check fmt cargo fmt --all --check || true
          run_check clippy cargo clippy --all-targets --all-features -- -D warnings || true
          run_check test cargo test --all-targets --all-features || true
          run_check build cargo build --release || true
          cat rust-check-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rust-compact-check-report
          path: rust-check-report.txt
          if-no-files-found: error
