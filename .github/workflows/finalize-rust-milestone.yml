name: Finalize Rust milestone

on:
  push:
    branches:
      - rewrite/rust-v2

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/rust-v2
          fetch-depth: 0
      - name: Validate, clean helpers, and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin rewrite/rust-v2

          # Remove every temporary helper used while the connector could not run rustfmt locally.
          rm -f \
            .github/workflows/background-import-fix-once.yml \
            .github/workflows/clippy-diagnose-once.yml \
            .github/workflows/clippy-report-once.yml \
            .github/workflows/fix-clippy-cleanup-once.yml \
            .github/workflows/fix-provider-once.yml \
            .github/workflows/fix-verification-once.yml \
            .github/workflows/local-parity-once.yml \
            .github/workflows/lock-rust-once.yml \
            .github/workflows/normalize-ui-once.yml \
            .github/workflows/rust-check-report.yml \
            .github/workflows/rustfmt-once.yml \
            .github/workflows/validate-rust-once.yml \
            .github/workflows/wire-background-tui-once.yml \
            .github/workflows/wire-discovery-once.yml \
            .github/workflows/wire-filter-ui-once.yml \
            .github/workflows/wire-identity-reconciliation-once.yml \
            .github/workflows/wire-local-once.yml

          cargo fmt --all
          mkdir -p ci
          : > ci/validation.txt
          failed=0
          run_check() {
            local name="$1"; shift
            echo "===== $name =====" >> ci/validation.txt
            set +e
            CARGO_TERM_COLOR=never "$@" > /tmp/rust-check.out 2>&1
            local code=$?
            set -e
            echo "exit=$code" >> ci/validation.txt
            if [ "$code" -ne 0 ]; then
              tail -n 220 /tmp/rust-check.out >> ci/validation.txt
              failed=1
              return 1
            fi
            echo ok >> ci/validation.txt
            return 0
          }

          run_check fmt cargo fmt --all --check || true
          if [ "$failed" -eq 0 ]; then run_check clippy cargo clippy --locked --all-targets --all-features -- -D warnings || true; fi
          if [ "$failed" -eq 0 ]; then run_check test cargo test --locked --all-targets --all-features || true; fi
          if [ "$failed" -eq 0 ]; then run_check build cargo build --locked --release || true; fi

          if [ "$failed" -eq 0 ]; then
            echo "STRICT_VALIDATION=GREEN" >> ci/validation.txt
            ls -lh target/release/jobscout >> ci/validation.txt
            commit_message="Finalize Rust discovery and TUI milestone"
          else
            echo "STRICT_VALIDATION=FAILED" >> ci/validation.txt
            commit_message="Record Rust milestone validation failure"
          fi

          rm .github/workflows/finalize-rust-milestone.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "$commit_message"

          for attempt in 1 2 3; do
            git pull --rebase origin rewrite/rust-v2 || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:rewrite/rust-v2; then
              exit 0
            fi
            sleep 2
          done
          echo "Could not push finalized milestone after retries" >&2
          exit 1
