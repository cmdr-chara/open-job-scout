name: Fix verification once

on:
  push:
    branches:
      - rewrite/rust-v2

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/rust-v2
      - name: Gate test helpers and self-remove
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/verification.rs')
          text = path.read_text()
          text = text.replace('pub fn is_safe_public_url(value: &str) -> bool {', '#[cfg(test)]\npub fn is_safe_public_url(value: &str) -> bool {')
          text = text.replace('fn validate_target(value: &str) -> Result<ValidatedTarget, FetchError> {', '#[cfg(test)]\nfn validate_target(value: &str) -> Result<ValidatedTarget, FetchError> {')
          path.write_text(text)
          PY
          cargo fmt --all
          rm .github/workflows/fix-verification-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/verification.rs .github/workflows/fix-verification-once.yml
          git commit -m "Gate verification test helpers"
          git push origin HEAD:rewrite/rust-v2
