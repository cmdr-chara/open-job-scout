name: Rust v2

on:
  push:
    branches:
      - main
      - rewrite/rust-v2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out rewrite branch
        uses: actions/checkout@v4

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Build release binary
        run: cargo build --locked --release

      - name: Show release size
        run: ls -lh target/release/jobscout

      - name: Upload preview binary
        uses: actions/upload-artifact@v7
        with:
          name: openjobscout-rust-v2-linux-x64
          path: target/release/jobscout
          if-no-files-found: error
