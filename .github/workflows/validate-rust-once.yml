name: Validate Rust once

on:
  push:
    branches:
      - rewrite/rust-v2

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/rust-v2
      - name: Validate and record compact result
        shell: bash
        run: |
          set +e
          mkdir -p ci
          : > ci/validation.txt
          failed=0
          for spec in \
            'fmt|cargo fmt --all --check' \
            'clippy|cargo clippy --all-targets --all-features -- -D warnings' \
            'test|cargo test --all-targets --all-features' \
            'build|cargo build --release'; do
            name="${spec%%|*}"
            command="${spec#*|}"
            echo "===== $name =====" >> ci/validation.txt
            bash -lc "$command" > /tmp/validation.out 2>&1
            code=$?
            echo "exit=$code" >> ci/validation.txt
            if [ $code -ne 0 ]; then
              tail -n 180 /tmp/validation.out >> ci/validation.txt
              failed=1
              break
            fi
            echo ok >> ci/validation.txt
          done
          if [ $failed -eq 0 ]; then
            echo "STRICT_VALIDATION=GREEN" >> ci/validation.txt
            ls -lh target/release/jobscout >> ci/validation.txt
          else
            echo "STRICT_VALIDATION=FAILED" >> ci/validation.txt
          fi
          rm .github/workflows/validate-rust-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/validation.txt .github/workflows/validate-rust-once.yml
          git commit -m "Record Rust discovery validation"
          git push origin HEAD:rewrite/rust-v2
          exit 0
