name: Wire identity reconciliation once

on:
  push:
    branches:
      - rewrite/rust-v2

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/rust-v2
      - name: Wire reconciliation and self-remove
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('src/main.rs')
          text = main.read_text()
          if 'mod migration;' not in text:
              text = text.replace('mod model;\n', 'mod model;\nmod migration;\n', 1)
          main.write_text(text)

          for filename in ('src/discovery.rs', 'src/operations.rs', 'src/workflows.rs'):
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text()
              # Add migration to grouped crate import when possible.
              if 'migration,' not in text and 'migration::' not in text:
                  text = text.replace('    importing,', '    importing, migration,', 1)
              # Reconcile just before the discovery-style save. Each file has a retained Vec<Job>.
              marker = '    let stored = importing::save_jobs(storage, &retained)?;'
              if marker in text and 'reconcile_existing_ids(storage, &mut retained)' not in text:
                  text = text.replace(
                      marker,
                      '    migration::reconcile_existing_ids(storage, &mut retained)?;\n' + marker,
                      1,
                  )
              # operations::search uses local storage by reference but same marker can differ.
              marker2 = '    let stored = importing::save_jobs(&storage, &retained)?;'
              if marker2 in text and 'reconcile_existing_ids(&storage, &mut retained)' not in text:
                  text = text.replace(
                      marker2,
                      '    migration::reconcile_existing_ids(&storage, &mut retained)?;\n' + marker2,
                      1,
                  )
              path.write_text(text)
          PY
          cargo fmt --all
          rm .github/workflows/wire-identity-reconciliation-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/wire-identity-reconciliation-once.yml
          git commit -m "Reconcile native discoveries with existing tracker identities"
          git push origin HEAD:rewrite/rust-v2
