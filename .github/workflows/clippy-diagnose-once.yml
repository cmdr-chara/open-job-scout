name: Clippy diagnose once

on:
  push:
    branches:
      - rewrite/rust-v2

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/rust-v2
      - name: Capture diagnostics and self-remove
        shell: bash
        run: |
          set +e
          mkdir -p ci
          CARGO_TERM_COLOR=never cargo clippy --all-targets --all-features -- -D warnings > ci/clippy-report.txt 2>&1
          code=$?
          echo >> ci/clippy-report.txt
          echo "exit=$code" >> ci/clippy-report.txt
          rm .github/workflows/clippy-diagnose-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/clippy-report.txt .github/workflows/clippy-diagnose-once.yml
          git commit -m "Capture Clippy diagnostics"
          git push origin HEAD:rewrite/rust-v2
          exit 0
