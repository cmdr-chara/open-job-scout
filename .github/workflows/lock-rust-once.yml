name: Lock Rust dependencies once

on:
  push:
    branches:
      - rewrite/rust-v2

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/rust-v2
      - name: Generate lockfile and self-remove
        shell: bash
        run: |
          cargo generate-lockfile
          rm .github/workflows/lock-rust-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows/lock-rust-once.yml
          git commit -m "Lock Rust application dependencies"
          git push origin HEAD:rewrite/rust-v2
