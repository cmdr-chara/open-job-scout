name: Rust release

on:
  workflow_dispatch:
  push:
    branches:
      - 'v0.2.0'
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: open-job-scout-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
      - name: Test locked dependency graph
        run: cargo test --locked --all-targets --all-features
      - name: Build optimized binary
        run: cargo build --locked --release
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          name="openjobscout-${os}-${arch}"
          mkdir -p dist
          cp target/release/jobscout "dist/jobscout"
          tar -C dist -czf "dist/${name}.tar.gz" jobscout
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"
          else
            sha256sum "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"
          fi
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/jobscout.exe dist/jobscout.exe
          $arch = $env:RUNNER_ARCH.ToLower()
          $name = "openjobscout-windows-$arch.zip"
          Compress-Archive -Path dist/jobscout.exe -DestinationPath "dist/$name" -Force
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content "dist/$name.sha256" -NoNewline
      - name: Upload Unix artifact
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openjobscout-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/openjobscout-*.tar.gz
            dist/openjobscout-*.tar.gz.sha256
          if-no-files-found: error
      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openjobscout-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/openjobscout-windows-*.zip
            dist/openjobscout-windows-*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/v0.2.0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: openjobscout-*
          path: dist
          merge-multiple: true
      - name: Publish release and checksums
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: OpenJobScout ${{ github.ref_name }}
          tag_name: v0.2.0
          generate_release_notes: true
          files: dist/*
