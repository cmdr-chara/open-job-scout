[package]
name = "openjobscout-langbench-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0"
rusqlite = { version = "0", features = ["bundled"] }
scraper = "0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
